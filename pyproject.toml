[project]
name = "canarias-backend"
version = "0.1.0"
description = "Backend API for the Canarias map application"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "beautifulsoup4>=4.15.0",
    "fastapi",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "alembic/versions",
]
