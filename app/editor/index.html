<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Canarias Cerca · Admin</title>
  <link rel="stylesheet" href="/editor/editor.css">
</head>
<body>
  <header class="topbar">
    <div>
      <span class="eyebrow">CANARIAS CERCA</span>
      <h1>Admin</h1>
    </div>
    <nav id="area-tabs" class="area-tabs"></nav>
    <div class="top-actions">
      <input id="token" type="password" placeholder="Token remoto" autocomplete="off">
      <button id="reload" type="button">↻ Recargar</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="selectors">
        <label id="island-row">Isla<select id="island"></select></label>
        <label id="resource-row">Sección<select id="resource"></select></label>
        <label id="month-row" class="hidden">Mes<input id="month" type="month"></label>
      </div>
      <input id="search" class="search" placeholder="Buscar…">
      <button id="new-item" class="primary" type="button">+ Nuevo</button>
      <div id="summary" class="summary"></div>
      <div id="items" class="item-list"></div>
    </aside>

    <section class="workspace">
      <div id="empty" class="empty-state">
        <h2>Canarias Cerca Admin</h2>
        <p>Guía, Explore, Calendar, News, Live y Media en un solo sitio.</p>
      </div>

      <form id="form" class="editor-form hidden">
        <div class="form-head">
          <div>
            <span id="mode" class="eyebrow">EDITAR</span>
            <h2 id="form-title">Contenido</h2>
          </div>
          <div class="actions">
            <button id="delete" class="danger" type="button">Ocultar / eliminar</button>
            <button id="save" class="primary" type="submit">Guardar</button>
          </div>
        </div>

        <div class="grid two">
          <label id="identity-row">Slug / ID<input id="identity"></label>
          <label>Nombre / título<input id="name"></label>
          <label id="category-row">Categoría<input id="category"></label>
          <label id="order-row">Orden<input id="order" type="number"></label>
        </div>

        <div id="date-fields" class="grid two hidden">
          <label>Fecha inicio<input id="start_date" type="date"></label>
          <label>Fecha fin<input id="end_date" type="date"></label>
          <label>Lugar<input id="location_name"></label>
          <label class="check"><input id="all_day" type="checkbox"> Todo el día</label>
        </div>

        <label>Descripción / resumen<textarea id="description" rows="7"></textarea></label>

        <div class="grid two">
          <label id="tags-row">Tags (coma)<input id="tags"></label>
          <label class="check" id="featured-row"><input id="featured" type="checkbox"> Featured</label>
          <label class="check" id="verified-row"><input id="verified" type="checkbox"> Verified</label>
          <label class="check" id="hidden-row"><input id="hidden-item" type="checkbox"> Oculto</label>
          <label id="lat-row">Latitud<input id="latitude" type="number" step="any"></label>
          <label id="lon-row">Longitud<input id="longitude" type="number" step="any"></label>
        </div>

        <section id="media-box" class="media-box">
          <div><span class="eyebrow">IMAGEN</span><h3>Media</h3></div>
          <div class="media-layout">
            <div id="image-preview" class="image-preview">Sin imagen</div>
            <div class="media-fields">
              <label>Image URL<input id="image_url" type="url"></label>
              <label>Crédito<input id="image_credit"></label>
              <div class="grid two">
                <label>Licencia<input id="image_license"></label>
                <label>Origen<input id="image_origin"></label>
              </div>
              <label>URL fuente imagen<input id="image_source_url" type="url"></label>
              <label>URL licencia<input id="image_license_url" type="url"></label>
              <div class="upload-row">
                <input id="photo-file" type="file" accept="image/jpeg,image/png,image/webp,image/avif" disabled>
                <button id="upload-photo" type="button" disabled>Subir a R2</button>
                <small id="upload-status">Upload R2 pendiente de configuración.</small>
              </div>
            </div>
          </div>
        </section>

        <label id="source-row">Source / website URL<input id="source_url" type="url"></label>

        <details class="advanced">
          <summary>JSON avanzado</summary>
          <p>Los campos no cubiertos por el formulario se conservan aquí.</p>
          <textarea id="raw-json" rows="18" spellcheck="false"></textarea>
        </details>

        <p id="status" class="status"></p>
      </form>

      <section id="readonly-panel" class="readonly-panel hidden">
        <div class="form-head">
          <div>
            <span id="readonly-label" class="eyebrow">READ ONLY</span>
            <h2 id="readonly-title">Snapshot</h2>
          </div>
        </div>
        <pre id="readonly-json"></pre>
      </section>
    </section>
  </main>

  <script src="/editor/editor.js" defer></script>
</body>
</html>
